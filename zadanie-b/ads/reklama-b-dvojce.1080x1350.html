<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Reklama B — dvojče (1080×1350)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=block">
<style>
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
  body { background: #FFD400; color: #111; font-family: 'Archivo', sans-serif; position: relative; }
  .mark { position: absolute; top: 56px; left: 72px; font-weight: 800; font-size: 40px; font-stretch: 90%; letter-spacing: -0.02em; }
  .mark b { color: #D4261C; }
  h1 {
    position: absolute; top: 140px; left: 72px; right: 72px; margin: 0;
    font-size: 112px; line-height: 0.97; font-weight: 800; font-stretch: 78%; letter-spacing: -0.015em;
  }
  .twin { position: absolute; top: 560px; left: 72px; right: 72px; display: grid; grid-template-columns: 1fr 90px 1fr; align-items: stretch; }
  .card { border: 6px solid #111; border-radius: 14px; padding: 36px 32px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
  .card.no { background: transparent; border-style: dashed; }
  .tk { font-size: 150px; font-weight: 800; font-stretch: 70%; line-height: .95; }
  .no .tk { text-decoration: line-through; text-decoration-color: #D4261C; text-decoration-thickness: 12px; }
  .fee { font-size: 38px; }
  .flag { font-size: 34px; font-weight: 700; margin-top: 14px; }
  .no .flag { color: #D4261C; }
  .yes .flag { color: #0B7A43; }
  .eq { align-self: center; text-align: center; font-size: 96px; font-weight: 800; }
  .more { position: absolute; left: 72px; right: 72px; top: 950px; margin: 0; font-size: 40px; line-height: 1.3; }
  .cta {
    position: absolute; left: 72px; right: 72px; bottom: 64px; height: 120px;
    background: #111; color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 46px; font-weight: 700; border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="mark">poplatko<b>měr</b></div>
  <h1>VOO si v Česku nekoupíte. Jeho dvojče ano.</h1>
  <div class="twin">
    <div class="card no"><span class="tk">VOO</span><span class="fee" data-k="voofee">0,03 % ročně</span><span class="flag">V EU nekoupíte</span></div>
    <div class="eq">=</div>
    <div class="card yes"><span class="tk" data-k="twin">SPYL</span><span class="fee" data-k="twinfee">0,03 % ročně</span><span class="flag">Koupíte v Česku</span></div>
  </div>
  <p class="more">Stejný index S&amp;P 500, stejně nízký poplatek.<br>+ dalších 11 ETF z NYSE a jejich evropská dvojčata.</p>
  <div class="cta">Srovnání zdarma</div>
<script src="../site/data.js"></script>
<script>
  var voo = window.ETF_DATA.etfs.filter(function (e) { return e.ticker === 'VOO'; })[0];
  var pct = function (n) { return n.toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' % ročně'; };
  var set = function (k, t) { document.querySelector('[data-k="' + k + '"]').textContent = t; };
  set('voofee', pct(voo.ter));
  set('twin', voo.twin.ticker);
  set('twinfee', pct(voo.twin.ter));
</script>
</body>
</html>
