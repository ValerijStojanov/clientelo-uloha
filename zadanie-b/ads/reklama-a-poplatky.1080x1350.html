<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Reklama A — poplatky (1080×1350)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=block">
<style>
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: #FFD400; color: #111; font-family: 'Archivo', sans-serif;
    font-variant-numeric: tabular-nums; position: relative;
  }
  .mark { position: absolute; top: 56px; left: 72px; font-weight: 800; font-size: 40px; font-stretch: 90%; letter-spacing: -0.02em; }
  .mark b { color: #D4261C; }
  h1 {
    position: absolute; top: 140px; left: 72px; right: 72px; margin: 0;
    font-size: 104px; line-height: 0.98; font-weight: 800; font-stretch: 78%; letter-spacing: -0.015em;
  }
  .sub { position: absolute; top: 368px; left: 72px; right: 72px; margin: 0; font-size: 40px; color: #3A3A36; }
  .receipt {
    position: absolute; left: 72px; right: 72px; top: 470px;
    background: #fff; padding: 40px 48px 44px;
  }
  .receipt::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -22px; height: 22px;
    background:
      linear-gradient(135deg, #fff 11px, transparent 0) 0 0 / 22px 22px repeat-x,
      linear-gradient(225deg, #fff 11px, transparent 0) 0 0 / 22px 22px repeat-x;
  }
  .head { font-size: 26px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #6A6A64; padding-bottom: 18px; border-bottom: 2px dashed #E3E1D8; }
  .row { display: flex; justify-content: space-between; font-size: 38px; padding: 18px 0; border-bottom: 2px dashed #E3E1D8; }
  .row b { font-weight: 700; }
  .row small { display: block; font-size: 24px; color: #6A6A64; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 22px; }
  .total span { font-size: 36px; font-weight: 700; }
  .total strong { font-size: 104px; font-weight: 800; font-stretch: 75%; color: #D4261C; line-height: 1; }
  .cta {
    position: absolute; left: 72px; right: 72px; bottom: 64px; height: 120px;
    background: #111; color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 46px; font-weight: 700; border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="mark">poplatko<b>měr</b></div>
  <h1>Kolik vám za 20&nbsp;let sežerou poplatky?</h1>
  <p class="sub">Příklad: 3 000 Kč měsíčně, fond z banky proti ETF</p>
  <div class="receipt">
    <div class="head">Účtenka za 20 let</div>
    <div class="row"><span>Vložíte celkem</span><b data-k="in">720 000 Kč</b></div>
    <div class="row"><span>Fond z banky<small data-k="bankfee">poplatek</small></span><b data-k="bank">–</b></div>
    <div class="row"><span>ETF<small data-k="etffee">poplatek</small></span><b data-k="etf">–</b></div>
    <div class="total"><span>Rozdíl</span><strong data-k="diff">–</strong></div>
  </div>
  <div class="cta">Spočítejte si svou částku</div>
<script src="../site/data.js"></script>
<script>
  // Stejný výpočet jako kalkulačka na stránce (site/app.js → grow), 3 000 Kč, 20 let.
  var C = window.ETF_DATA.calc, m = 3000, y = 20;
  function grow(ter, entry) {
    var g = Math.pow(1 + C.returnPct / 100, 1 / 12) - 1, f = ter / 100 / 12, v = 0;
    for (var i = 0; i < y * 12; i++) v = (v + m * (1 - entry / 100)) * (1 + g) * (1 - f);
    return v;
  }
  var nf = new Intl.NumberFormat('cs-CZ');
  var czk = function (n) { return nf.format(Math.round(n / 1000) * 1000) + ' Kč'; };
  var pct = function (n) { return n.toLocaleString('cs-CZ', { maximumFractionDigits: 2 }) + ' %'; };
  var bank = grow(C.bank.ter, C.bank.entry), etf = grow(C.etf.ter, 0);
  var set = function (k, t) { document.querySelector('[data-k="' + k + '"]').textContent = t; };
  set('bank', czk(bank)); set('etf', czk(etf)); set('diff', '−' + czk(etf - bank));
  set('bankfee', pct(C.bank.ter) + ' ročně + ' + pct(C.bank.entry) + ' z vkladu');
  set('etffee', C.etf.label + ', ' + pct(C.etf.ter) + ' ročně');
</script>
</body>
</html>
